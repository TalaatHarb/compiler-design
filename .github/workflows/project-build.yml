name: Build project
on:
  push:
    branches: [ master ]
    paths:
      - compiler-design/**
      - .github/workflows/project-build.yml

jobs:
  build-project:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build and verify with Maven
        run: cd compiler-design && mvn clean compile verify package -DnvdApiKey=$NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
